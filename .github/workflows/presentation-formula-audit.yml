name: Original PowerPoint math forensic inspection
on:
  pull_request:
    paths:
      - ".github/workflows/presentation-formula-audit.yml"
      - "scripts/audit_original_math_objects.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve main and historical committed slide binaries without modifying them
        run: |
          git fetch origin main --depth=1
          git fetch origin 6cd0c67987a6c8c5d8f4b9c8dedd983b54e8128a --depth=1
          git fetch origin 72bef39cd71878a30b8af101c60466975ad9fc25 --depth=1
      - name: Inspect exact PowerPoint objects and extract original embedded assets
        run: |
          python -m pip install python-pptx
          python scripts/audit_original_math_objects.py origin/main 6cd0c67987a6c8c5d8f4b9c8dedd983b54e8128a 72bef39cd71878a30b8af101c60466975ad9fc25
      - uses: actions/upload-artifact@v4
        with:
          name: read-only-source-formula-assets
          path: presentations/formula_integrity_diagnostics/
      - name: Save source-image evidence only on diagnostic branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'audit/presentation-formula-integrity-20261015' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/formula_integrity_diagnostics/
          if ! git diff --cached --quiet; then
            git commit -m "Archive untouched slide 7/8 equation assets for editability review"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
