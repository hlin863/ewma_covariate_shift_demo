name: PowerPoint equation integrity audit
on:
  pull_request:
    paths:
      - "presentations/**"
      - "scripts/repair_grouped_math_images.py"
      - "scripts/create_equation_compatible_deck.py"
      - ".github/workflows/presentation-formula-audit.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  equation-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PowerPoint inspection dependency
        run: python -m pip install python-pptx
      - name: Identify unconverted slide 7 and 8 group structures
        run: |
          python - <<'PY'
          from pptx import Presentation
          from pptx.enum.shapes import MSO_SHAPE_TYPE
          from collections import Counter
          ppt=Presentation("presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx")
          for n in (7,8):
              sl=ppt.slides[n-1]
              print("===== SLIDE",n,"SHAPES",len(sl.shapes),"=====")
              for k,sh in enumerate(sl.shapes):
                  if sh.shape_type!=MSO_SHAPE_TYPE.GROUP:
                      print("OTHER",k,str(sh.shape_type),repr(sh.text[:60] if sh.has_text_frame else ""))
                      continue
                  print("GROUP",k,"name",sh.name,"CHILDREN",len(sh.shapes),"rect",[round(x/914400,2) for x in (sh.left,sh.top,sh.width,sh.height)])
                  for j,ch in enumerate(sh.shapes):
                      refs=ch._element.xpath(".//*[local-name()='blip']")
                      embeds=[ref.get("{http://schemas.openxmlformats.org/officeDocument/2006/relationships}embed") for ref in refs]
                      print("  CHILD",j,str(ch.shape_type),"name",ch.name,"text",repr(ch.text[:100] if ch.has_text_frame else ""), "blips",embeds,"xmltags",Counter(e.tag.rsplit("}",1)[-1] for e in ch._element.iter()).most_common(12))
          PY
      - name: Repair existing grouped equations without retyping
        run: |
          python scripts/repair_grouped_math_images.py \
            presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx \
            presentations/EWMA_Covariate_Shift_Progress_Review_FORMULAS_RESTORED.pptx
      - name: Verify slide 7 and 8 formulas and unchanged slide text
        run: |
          python - <<'PY'
          from pathlib import Path
          from pptx import Presentation
          from pptx.enum.shapes import MSO_SHAPE_TYPE
          src=Presentation("presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx")
          dst=Presentation("presentations/EWMA_Covariate_Shift_Progress_Review_FORMULAS_RESTORED.pptx")
          assert len(src.slides)==len(dst.slides)==44
          for n in (7,8):
              a,b=src.slides[n-1],dst.slides[n-1]
              content=lambda sl:"\n".join(sh.text for sh in sl.shapes if sh.has_text_frame)
              assert content(a)==content(b),f"Slide {n} text changed"
              old=sum(sh.shape_type==MSO_SHAPE_TYPE.GROUP for sh in a.shapes)
              new=sum(sh.shape_type==MSO_SHAPE_TYPE.PICTURE for sh in b.shapes)
              print(f"SLIDE {n}: original groups={old}, restored pictures={new}")
              assert old>0, f"Slide {n}: no groups to inspect"
              if new<old: print(f"Slide {n}: unconverted vector/compound groups remain; see diagnostics")
          print("Slide 7/8 original equation images and text verified")
          PY
      - name: Upload repaired PowerPoint
        uses: actions/upload-artifact@v4
        with:
          name: slides-7-8-equations-recovered
          path: presentations/EWMA_Covariate_Shift_Progress_Review_FORMULAS_RESTORED.pptx
      - name: Save corrected presentation to the PR branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'audit/presentation-formula-integrity-20261015' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/EWMA_Covariate_Shift_Progress_Review_FORMULAS_RESTORED.pptx
          if ! git diff --cached --quiet; then
            git commit -m "Restore slide 7 and 8 original equation image shapes"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
