name: PowerPoint equation integrity audit
on:
  pull_request:
    paths:
      - "presentations/**"
      - "scripts/audit_presentation_equations.py"
      - ".github/workflows/presentation-formula-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equation-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download previous presentation revision for comparison
        run: |
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/hlin863/ewma_covariate_shift_demo/6cd0c67987a6c8c5d8f4b9c8dedd983b54e8128a/presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx" \
            -o /tmp/presentation_before.pptx
      - name: Compare slide equation objects
        run: |
          python scripts/audit_presentation_equations.py \
            presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx \
            --baseline /tmp/presentation_before.pptx \
            --json presentation_formula_audit.json
      - name: Audit 11 October deck for older equation-object baseline
        run: |
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/hlin863/ewma_covariate_shift_demo/3f4e4c132c2ec93656748186270eae0657cd12f4/presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx" \
            -o /tmp/presentation_oct11.pptx
          python scripts/audit_presentation_equations.py /tmp/presentation_oct11.pptx --json presentation_oct11_audit.json
      - name: Trace mathematical slides through older October revisions
        run: |
          for sha in 3d999c79acf1ef4a3c1a9616fb1b687e28718f75 2a8d20b6ddb88d3d94eb4cb5f301018e99101046 f3ef2e8b7ac6f5ecdd576476f83bf20129543e5b 56b0d5d36be4dd9b67295344ef2f3694cfd2c1e6 c93a6053515bf5102f75c33a9965c8c5559a2ead ad4bbb304048fbf836a68d332f867e90ef25b224 3754c40eaca3976944b79d9cc5f82358482050c; do
            url="https://raw.githubusercontent.com/hlin863/ewma_covariate_shift_demo/$sha/presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx"
            if curl -fsSL --retry 2 "$url" -o /tmp/history.pptx; then
              echo "===== HISTORICAL $sha ====="
              python scripts/audit_presentation_equations.py /tmp/history.pptx | grep -E "Current deck:|nativeMath= [1-9]|mathP= [1-9]|ole= [1-9]|SLIDE_TEXT:|CHECK UNRENDERED SOURCE" | head -55
            else
              echo "NOT_FOUND $sha"
            fi
          done
      - name: Inspect equation slide layout geometry
        run: |
          python -m pip install -q python-pptx
          python - <<'PY'
          from pptx import Presentation
          from pptx.util import Inches
          d=Presentation("presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx")
          print("PAGE INCHES",round(d.slide_width/914400,2),round(d.slide_height/914400,2))
          for n in (9,10,11,12,13,20,22,23,26):
            slide=d.slides[n-1]
            print("===== LAYOUT",n,"=====")
            for sh in slide.shapes:
              txt=sh.text.strip().replace("\n"," ") if sh.has_text_frame else ""
              if len(txt)>100:txt=txt[:97]+"..."
              print(f"SHAPE {sh.shape_type!s:12} x={sh.left/914400:5.2f} y={sh.top/914400:5.2f} w={sh.width/914400:5.2f} h={sh.height/914400:5.2f} txt={txt}")
          PY
      - name: Inspect embedded formula groups and rendering dependencies
        run: |
          python - <<'PY'
          from pptx import Presentation
          from collections import Counter
          d=Presentation("presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx")
          for n in (9,10,11,12,13,20,22,23,26):
            for i,sh in enumerate(d.slides[n-1].shapes):
              if sh.shape_type == 6:
                types=Counter(str(c.shape_type) for c in sh.shapes)
                text=[" ".join(c.text.split())[:80] for c in sh.shapes if c.has_text_frame and c.text.strip()]
                xml=sh._element.xml
                print(f"FORMULA_GROUP slide={n} index={i} children={len(sh.shapes)} types={types} text={text[:3]} xml_len={len(xml)} has_customgeom={'custGeom' in xml} has_blip={'blip' in xml} has_Glyph={'glyph' in xml}")
          PY
          command -v libreoffice || true
      - name: Trace formula image fills to embedded media
        run: |
          python - <<'PY'
          from pptx import Presentation
          from zipfile import ZipFile
          from collections import Counter
          from lxml import etree
          from pathlib import PurePosixPath
          p="presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx"
          d=Presentation(p)
          with ZipFile(p) as z:
            media=[n for n in z.namelist() if n.startswith("ppt/media/")]
            print("MEDIA_TOTAL",len(media),"TYPES",Counter(n.rsplit(".",1)[-1] for n in media))
            for n in (9,10,11,12,13,20,22,23,26):
              slide=d.slides[n-1]
              for i,grp in enumerate(slide.shapes):
                if grp.shape_type!=6:continue
                for child in grp.shapes:
                  blips=child._element.xpath(".//*[local-name()='blip']")
                  for b in blips:
                    embed=b.get("{http://schemas.openxmlformats.org/officeDocument/2006/relationships}embed")
                    rid=slide.part.rels.get(embed) if embed else None
                    part=rid.target_part if rid and not rid.is_external else None
                    payload=part.blob if part else b""
                    print(f"MEDIA_FORMULA slide={n} group={i} embed={embed} target={part.partname if part else None} size={len(payload)} prefix={payload[:18]!r} mime={part.content_type if part else None}")
          PY
      - name: Trace original manually edited September slides and latest main
        run: |
          python - <<'PY'
          import urllib.request,zipfile,re,io,collections
          from xml.etree import ElementTree as ET
          revisions=[
            ("2026-09-28-init","3ea5ef6b6f2c9517259b3693d6945e8ce538efdf","EWMA_Covariate_Shift_Progress_Review_28_Sep_2026.pptx"),
            ("2026-09-28-update","32416401db8fe752a52a4c025214ca14540862e0","EWMA_Covariate_Shift_Progress_Review_28_Sep_2026.pptx"),
            ("2026-09-30","75fca152c61e967e7410015008e95f7463552be9","EWMA_Covariate_Shift_Progress_Review_28_Sep_2026.pptx"),
            ("2026-10-01-first","4db1878d2f4d8aa75b8ff55cc86d34553ac0f712","EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx"),
            ("2026-10-15-new-main","9d2362dcc5d0aefa535e8489c4c059c4d7ee6e5f","EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx"),
          ]
          a="http://schemas.openxmlformats.org/drawingml/2006/main"
          m="http://schemas.openxmlformats.org/officeDocument/2006/math"
          p="http://schemas.openxmlformats.org/presentationml/2006/main"
          for label,sha,filename in revisions:
            url=f"https://raw.githubusercontent.com/hlin863/ewma_covariate_shift_demo/{sha}/presentations/{filename}"
            print("===== REVISION",label,sha[:8],"=====",flush=True)
            try: raw=urllib.request.urlopen(url,timeout=30).read()
            except Exception as e:
              print("DOWNLOAD FAILED",repr(e));continue
            z=zipfile.ZipFile(io.BytesIO(raw))
            slides=sorted(((int(re.search(r"slide(\d+)\.xml$",v).group(1)),v) for v in z.namelist() if re.fullmatch(r"ppt/slides/slide\d+\.xml",v)))
            print("SIZE",len(raw),"SLIDES",len(slides),flush=True)
            totals=collections.Counter()
            for n,path in slides:
              root=ET.fromstring(z.read(path))
              nodes=list(root.iter())
              txt=[(e.text or "").strip() for e in nodes if e.tag=="{%s}t"%a]
              content=" | ".join(t for t in txt if t)
              name=next((t for t in txt if len(t)>6),"(untitled)")
              counts=collections.Counter(x.tag.split("}")[-1] for x in nodes)
              mathcount=sum(1 for x in nodes if x.tag=="{%s}oMath"%m)
              pics=counts["pic"]; frames=counts["graphicFrame"]; groups=counts["grpSp"]; shapes=counts["sp"]
              totals.update(math=mathcount,pics=pics,frames=frames,groups=groups,shapes=shapes)
              if "MATH" in content.upper() or "EWMA" in content.upper() or "HOTELLING" in content.upper() or "CSP" in content.upper() or n in (3,4,5,6):
                print("SLIDE",n,"TITLE",name[:85],"math",mathcount,"pics",pics,"frames",frames,"groups",groups,"shapes",shapes,flush=True)
                print("TEXT",content[:1600],flush=True)
            print("COUNTS",dict(totals),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-formula-audit
          path: presentation_formula_audit.json
