name: Compact editable equations across all slides
on:
  pull_request:
    paths:
      - scripts/apply_compact_equation_typography.py
      - presentations/compact_equation_manifest.json
      - .github/workflows/compact-editable-equations.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compact-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve main PowerPoint as source
        run: |
          git fetch origin main --depth=1
          git show origin/main:presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx > /tmp/source_main.pptx
          git rev-parse origin/main
      - name: Generate compact editable mathematical notation
        run: |
          python -m pip install python-pptx
          python scripts/apply_compact_equation_typography.py \
            /tmp/source_main.pptx \
            presentations/EWMA_Covariate_Shift_Progress_Review_COMPACT_EDITABLE_PROOF.pptx \
            presentations/compact_equation_manifest.json
      - name: Render full deck and inspect all math slides
        run: |
          if ! command -v libreoffice >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libreoffice-impress poppler-utils
          fi
          mkdir -p /tmp/render_compact presentations/compact_math_review
          libreoffice -env:UserInstallation=file:///tmp/lo_compact_math \
            --headless --convert-to pdf --outdir /tmp/render_compact \
            presentations/EWMA_Covariate_Shift_Progress_Review_COMPACT_EDITABLE_PROOF.pptx
          PDF=/tmp/render_compact/EWMA_Covariate_Shift_Progress_Review_COMPACT_EDITABLE_PROOF.pdf
          pdfinfo "$PDF" | grep 'Pages:'
          for n in 4 7 8 9 10 11 12 13 20 21 22 23 26 36; do
            pdftoppm -f "$n" -l "$n" -singlefile -scale-to-x 1200 -scale-to-y -1 -png "$PDF" "presentations/compact_math_review/slide_${n}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: compact-editable-math-presentation
          path: |
            presentations/EWMA_Covariate_Shift_Progress_Review_COMPACT_EDITABLE_PROOF.pptx
            presentations/compact_equation_manifest.json
      - name: Archive reviewed output in diagnostic branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'audit/presentation-formula-integrity-20261015' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/EWMA_Covariate_Shift_Progress_Review_COMPACT_EDITABLE_PROOF.pptx presentations/compact_math_review
          if ! git diff --cached --quiet; then
            git commit -m "Verify visible compact equation typography on every mathematical slide"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
