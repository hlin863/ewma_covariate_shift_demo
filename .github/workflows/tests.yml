name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Generate synthetic bagging results
        run: |
          python -m scripts.run_bagging_bci_synthetic
          echo "---- bagging_synthetic_bci.csv ----"
          cat outputs/metrics/bagging_synthetic_bci.csv
      - name: Upload synthetic bagging results
        uses: actions/upload-artifact@v4
        with:
          name: bagging-synthetic-bci-results
          path: |
            outputs/metrics/bagging_synthetic_bci.csv
            outputs/figures/bagging_synthetic_accuracy.png
            outputs/figures/bagging_synthetic_disagreement.png
