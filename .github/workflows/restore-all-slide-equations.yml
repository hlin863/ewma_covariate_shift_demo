name: Convert complete presentation to editable native mathematics
on:
  pull_request:
    paths:
      - "scripts/restore_all_slide_equations.py"
      - ".github/workflows/restore-all-slide-equations.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-math-restoration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve latest main PowerPoint without overwriting it
        run: |
          git fetch origin main --depth=1
          git show origin/main:presentations/EWMA_Covariate_Shift_Progress_Review_Haocheng_Lin.pptx > /tmp/source-main.pptx
          git rev-parse origin/main
      - name: Convert every known equation graphic and verify all other OOXML bytes unchanged
        run: |
          python -m pip install python-pptx
          python scripts/restore_all_slide_equations.py \
            /tmp/source-main.pptx \
            presentations/EWMA_Covariate_Shift_Progress_Review_FULLY_EDITABLE_PROOF.pptx \
            presentations/COMPLETE_EQUATION_RESTORATION_AUDIT.json
      - name: Upload proof and provenance
        uses: actions/upload-artifact@v4
        with:
          name: entire-deck-editable-math-proof
          path: |
            presentations/EWMA_Covariate_Shift_Progress_Review_FULLY_EDITABLE_PROOF.pptx
            presentations/COMPLETE_EQUATION_RESTORATION_AUDIT.json
      - name: Archive successful output on diagnostic branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'audit/presentation-formula-integrity-20261015' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add presentations/EWMA_Covariate_Shift_Progress_Review_FULLY_EDITABLE_PROOF.pptx presentations/COMPLETE_EQUATION_RESTORATION_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "Verify all 22 mathematical images as editable OfficeMath objects"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
