[pytest]
testpaths = tests
# The dashboard consumes per-case actual/expected record_property evidence.
junit_family = xunit1
markers =
    unit: isolated deterministic unit tests
    contract: module interface and schema tests
    integration: multi-module pipeline tests
    regression: protects previously established behaviour and reproducibility outputs
    research: methodological and experimental invariants
    realdata: tests requiring external BCI Competition data files
    slow: computationally expensive tests
